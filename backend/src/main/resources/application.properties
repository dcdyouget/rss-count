# ── HTTP ──
quarkus.http.port=8080
quarkus.http.static-resources.index-page=index.html
quarkus.http.static-resources.paths=/static/

# ── CORS (development) ──
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.enabled=true

# ── Datasource: SQLite WAL mode ──
# max-size=2 needed for Hibernate JTA isolation delegate (inner flush work)
# busy_timeout=30000: SQLite waits up to 30s for write locks instead of SQLITE_BUSY
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:data/rsscount.db?journal_mode=DELETE&busy_timeout=30000&foreign_keys=ON
quarkus.datasource.jdbc.max-size=3
quarkus.datasource.jdbc.acquisition-timeout=PT60S

# ── Hibernate / Panache ──
quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.time-zone=UTC+8

# ── Logging ──
quarkus.log.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=data/app.log
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.category."org.rsscount".level=DEBUG

# ── JSON ──
quarkus.jackson.write-dates-as-timestamps=false
