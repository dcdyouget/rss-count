# ── HTTP (shared) ──
quarkus.http.port=8080
quarkus.http.static-resources.index-page=index.html
quarkus.http.static-resources.paths=/static/

# ── Dev profile: SQLite ──
# journal_mode=DELETE: busy_timeout properly handles SQLITE_BUSY for write contention
#   (WAL's SQLITE_BUSY_SNAPSHOT is NOT handled by busy_timeout)
# max-size=2: 1 for main + 1 for format thread (FORMAT_THREADS=1 serializes writes)
# busy_timeout=60000: SQLite waits 60s for write locks
# IDENTITY ID generation: no sequence tables, no row-lock contention
%dev.quarkus.datasource.db-kind=sqlite
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:data/rsscount.db?journal_mode=DELETE&busy_timeout=60000&foreign_keys=ON
%dev.quarkus.datasource.jdbc.max-size=2
%dev.quarkus.datasource.jdbc.acquisition-timeout=PT120S
%dev.quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
%dev.quarkus.hibernate-orm.database.generation=update
%dev.quarkus.flyway.enabled=false

# ── Prod profile: PostgreSQL ── (defined in application-prod.properties)

# ── Shared settings ──
# ── Locale & Timezone ──
quarkus.default-locale=zh_CN
quarkus.native.timezone-default=Asia/Shanghai

# ── CORS ──
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.enabled=true

# ── Hibernate / Panache (shared) ──
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.time-zone=UTC+8

# ── Logging ──
quarkus.log.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=data/app.log
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.category."org.rsscount".level=INFO

# ── JSON ──
quarkus.jackson.write-dates-as-timestamps=false
