# ── HTTP ──
quarkus.http.port=8080
quarkus.http.static-resources.index-page=index.html
quarkus.http.static-resources.paths=/static/

# ── Locale & Timezone ──
quarkus.default-locale=zh_CN
quarkus.native.timezone-default=Asia/Shanghai

# ── CORS (production) ──
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:8080}
quarkus.http.cors.enabled=${CORS_ENABLED:false}

# ── Datasource: PostgreSQL ──
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rsscount}
quarkus.datasource.username=${DB_USER:rsscount}
quarkus.datasource.password=${DB_PASSWORD:rsscount123}
quarkus.datasource.jdbc.max-size=${DB_POOL_MAX:20}
quarkus.datasource.jdbc.acquisition-timeout=PT10S

# ── Hibernate / Panache ──
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.jdbc.time-zone=UTC+8

# ── Flyway ──
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=db/migration

# ── Logging ──
quarkus.log.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=data/app.log
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] %s%e%n
quarkus.log.category."org.rsscount".level=INFO

# ── JSON ──
quarkus.jackson.write-dates-as-timestamps=false
